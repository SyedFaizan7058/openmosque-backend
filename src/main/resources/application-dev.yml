# ==============================================================================
# OpenMosque Backend - Local Development Profile (application-dev.yml)
# ==============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:openmosque_db}
    
    username: ${DB_USERNAME:postgres}
    
    # Alternatively, you can set an environment variable named 'DB_PASSWORD' in Windows or IntelliJ.
    password: ${DB_PASSWORD:postgres123}
    
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      
  jpa:
    # Modern Hibernate 6.5 auto-detects PostGIS spatial capabilities with PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'validate' ensures database schema matches JPA Entities without accidental data loss
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          
  flyway:
    # Flyway manages database schema migrations (located in src/main/resources/db/migration)
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: ${SPRING_CACHE_TYPE:simple}

app:
  rate-limit:
    enabled: true
    backend: ${RATE_LIMIT_BACKEND:local}

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  level:
    com.openmosque: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
