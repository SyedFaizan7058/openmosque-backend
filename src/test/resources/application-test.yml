spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

  cache:
    type: none

app:
  prayer:
    aladhan:
      base-url: https://api.aladhan.com/v1
  security:
    firebase:
      enabled: false
      dev-mock-auth: true
